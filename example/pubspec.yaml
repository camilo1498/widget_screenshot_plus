name: widget_screenshot_plus_example
description: "Demonstrates how to use the widget_screenshot_plus plugin."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  path_provider: ^2.1.6
  share_plus: ^13.3.0

  widget_screenshot_plus:
    path: ../

  cupertino_icons: ^1.0.9

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
