name: widget_screenshot_plus_example
description: "Demonstrates how to use the widget_screenshot_plus plugin."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter
  path_provider: '>=2.1.0 <3.0.0'
  share_plus: '>=11.0.0 <14.0.0'

  widget_screenshot_plus:
    path: ../

  cupertino_icons: '>=1.0.5 <2.0.0'

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter

  flutter_lints: '>=4.0.0 <7.0.0'

flutter:
  uses-material-design: true
