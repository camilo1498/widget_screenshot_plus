name: widget_screenshot_plus
description: 'Capture Flutter widgets as images with scrollable content support. Export to PNG/JPEG with custom backgrounds. Perfect for sharing UI states or generating previews.'
version: 0.0.8
homepage: 'https://github.com/camilo1498/widget_screenshot_plus'
repository: 'https://github.com/camilo1498/widget_screenshot_plus'
issue_tracker: 'https://github.com/camilo1498/widget_screenshot_plus/issues'
topics:
  - screenshot
  - widget
  - image
  - share

environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: '>=4.0.0 <7.0.0'

flutter:
  plugin:
    platforms:
      android:
        package: com.example.widget_screenshot_plus
        pluginClass: WidgetScreenshotPlusPlugin
      ios:
        pluginClass: WidgetScreenshotPlusPlugin
